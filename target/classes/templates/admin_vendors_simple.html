<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Vendors - Simplified</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h1 {
            color: #333;
        }
        .vendor-list {
            margin-top: 20px;
        }
        .vendor-item {
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .error {
            color: red;
            padding: 10px;
            background-color: #ffecec;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Vendors (Simplified)</h1>
        
        <!-- Error message -->
        <div th:if="${error}" class="error">
            <p th:text="${error}">Error message</p>
        </div>
        
        <!-- Simple vendor list -->
        <div class="vendor-list">
            <h2>Vendors</h2>
            <div th:if="${vendors == null || vendors.empty}">
                <p>No vendors found in the system.</p>
            </div>
            <div th:each="vendor : ${vendors}" class="vendor-item">
                <p><strong>Name:</strong> <span th:text="${vendor.name}">Vendor Name</span></p>
                <p><strong>Category:</strong> <span th:text="${vendor.category}">Category</span></p>
                <p><strong>Location:</strong> <span th:text="${vendor.location != null ? vendor.location : 'N/A'}">Location</span></p>
            </div>
        </div>
        
        <div>
            <h2>Navigation</h2>
            <p><a href="/admin/home">Back to Admin Home</a></p>
            <p><a href="/admin/session-test">Check Session</a></p>
        </div>
    </div>
</body>
</html>
