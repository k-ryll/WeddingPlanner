<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/styles/register.css}">
    <title>Wedding Registration</title>
</head>
<body>
    <header>Wedding Planner</header>
    <div class="container">
        <form id="registrationForm" th:action="@{/user/save}" method="post" th:object="${user}">
            <h1>Create an Account</h1>
            <div>
                <label for="role">You are:</label>
                <select name="role" id="role" th:field="*{role}">
                    <option value="Bride">Bride</option>
                    <option value="Groom">Groom</option>
                    <option value="Organizer">Organizer</option>
                </select>
            </div>
            <div class="name">
                <div>
                    <label for="firstName">First Name:</label>
                    <input type="text" th:field="*{firstName}" name="firstName" id="firstName" required>
                </div>
                <div>
                    <label for="lastName">Last Name:</label>
                    <input type="text" th:field="*{lastName}" name="lastName" id="lastName" required>
                </div>        
            </div>
            <div>
                <label for="weddingDate">Wedding Date:</label>
                <input type="datetime-local" th:field="*{weddingDate}" name="weddingDate" id="weddingDate">
    <p id="date-error-message"></p> 
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" th:field="*{email}" name="email" id="email" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" th:field="*{password}" name="password" id="password" required>
            </div>
            <div>
                <label for="confirmPass">Confirm Password:</label>
                <input type="password" name="confirmPass" id="confirmPass" required>
                <p id="error-message"></p>
            </div>
            <div class="buttons">
                <a class="loginButton" href="/user/login">Already have an Account</a>
                <button type="submit">Register</button>
            </div>
        </form>
    </div>
    <script src="/js/signup.js"></script>
</body>
</html>
