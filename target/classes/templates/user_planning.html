<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <link rel="stylesheet" th:href="@{/styles/planning.css}">
    <link rel="stylesheet" th:href="@{/styles/modal.css}">
    <script src="https://kit.fontawesome.com/b80e3de11b.js"></script>
    <script th:src="@{/js/userMenu.js}"></script>
    <title>Wedding Planning</title>
</head>
<body>
    <header>
        <img src="/images/logo.svg" class="logo" alt="logo">
        <div>
            <ul>
                <li><a th:href="@{/home}">Home</a></li>
                <li><a th:href="@{/guests}">Guests</a></li>
                <li class="active"><a th:href="@{/planning}">Planning</a></li>
                <li><a th:href="@{/budget}">Budget</a></li>
                <li><a th:href="@{/seatplan}">Seat Plan</a></li>
            </ul>
            <div class="user-menu">
                <i class="fa-regular fa-circle-user user-icon"></i>
                <div class="user-dropdown">
                    <a th:href="@{/logout}" class="dropdown-item">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <input type="hidden" name="projectId" th:value="${projectId}">
        <h1>Wedding Planning</h1>
        
        <div class="planning-container">
            <!-- Tasks Section -->
            <section class="tasks-section">
                <div class="section-header">
                    <h2>Tasks</h2>
                    <button class="add-button" onclick="openTaskModal()">Add Task</button>
                </div>
                
                <div class="task-list">
                    <ul>
                        <li th:each="task : ${tasks}" class="task-item">
                            <div class="task-content">
                                <input type="checkbox" th:checked="${task.completed}" 
                                       th:data-task-id="${task.id}" class="task-checkbox">
                                <span th:text="${task.title}" th:class="${task.completed ? 'completed' : ''}"></span>
                                <span class="due-date" th:text="${task.dueDate}"></span>
                                <span class="priority" th:text="${task.priority}" th:class="${task.priority}"></span>
                            </div>
                            <div class="task-actions">
                                <div class="email-dropdown">
                                    <button class="email-btn">Send Task</button>
                                    <div class="email-dropdown-content">
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="ALL">Send to All Entourage</button>
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="Bride's Maid">Send to Bridesmaids</button>
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="Groomsman">Send to Groomsmen</button>
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="Maid of Honor">Send to Maid of Honor</button>
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="Best Man">Send to Best Man</button>
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="Father of the Bride">Send to Parents of the Bride</button>
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="Father of the Groom">Send to Parents of the Groom</button>
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="Flower Girl">Send to Flower Girls</button>
                                        <button onclick="sendTaskToEntourage(this)" th:data-task-id="${task.id}" data-entourage="Ring Bearer">Send to Ring Bearers</button>
                                    </div>
                                </div>
                                <button class="edit-btn" th:data-task-id="${task.id}">Edit</button>
                                <button class="delete-btn" th:data-task-id="${task.id}">Delete</button>
                            </div>
                        </li>
                    </ul>
                </div>
            </section>

            <!-- Itinerary Section -->
            <section class="itinerary-section">
                <div class="section-header">
                    <h2>Wedding Day Itinerary</h2>
                    <div class="itinerary-actions-top">
                        <button class="add-button" onclick="openItineraryModal()">Add Event</button>
                        <div class="email-dropdown">
                            <button class="email-btn">Email Itinerary</button>
                            <div class="email-dropdown-content">
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="ALL">Send to All Entourage</button>
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="Bride's Maid">Send to Bridesmaids</button>
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="Groomsman">Send to Groomsmen</button>
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="Maid of Honor">Send to Maid of Honor</button>
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="Best Man">Send to Best Man</button>
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="Father of the Bride">Send to Parents of the Bride</button>
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="Father of the Groom">Send to Parents of the Groom</button>
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="Flower Girl">Send to Flower Girls</button>
                                <button onclick="sendItineraryToEntourage(this)" data-entourage="Ring Bearer">Send to Ring Bearers</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="itinerary-list">
                    <ul>
                        <li th:each="item : ${itinerary}" class="itinerary-item">
                            <div class="time">
                                <span th:text="${item.startTime}"></span> - 
                                <span th:text="${item.endTime}"></span>
                            </div>
                            <div class="event-details">
                                <h4 th:text="${item.title}"></h4>
                                <p th:text="${item.description}"></p>
                                <p class="location" th:text="${item.location}"></p>
                            </div>
                            <div class="itinerary-actions">
                                <button class="edit-btn" th:data-item-id="${item.id}">Edit</button>
                                <button class="delete-btn" th:data-item-id="${item.id}">Delete</button>
                            </div>
                        </li>
                    </ul>
                </div>
            </section>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeTaskModal()">&times;</span>
            <h2>Add New Task</h2>
            <form id="taskForm" th:action="@{/task/add}" method="post" class="modal-form">
                <input type="text" name="title" placeholder="Task title" required>
                <textarea name="description" placeholder="Task description"></textarea>
                <input type="date" name="dueDate" required>
                <select name="priority" required>
                    <option value="HIGH">High Priority</option>
                    <option value="MEDIUM">Medium Priority</option>
                    <option value="LOW">Low Priority</option>
                </select>
                <button type="submit">Add Task</button>
            </form>
        </div>
    </div>

    <!-- Itinerary Modal -->
    <div id="itineraryModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeItineraryModal()">&times;</span>
            <h2>Add New Event</h2>
            <form id="itineraryForm" th:action="@{/itinerary/add}" method="post" class="modal-form">
                <input type="text" name="title" placeholder="Event title" required>
                <textarea name="description" placeholder="Event description"></textarea>
                <input type="time" name="startTime" required>
                <input type="time" name="endTime" required>
                <input type="text" name="location" placeholder="Location">
                <button type="submit">Add Event</button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/planning.js}"></script>
    <script th:src="@{/js/planning-events.js}"></script>
</body>
</html>
