<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <link rel="stylesheet" th:href="@{/styles/admin.css}"> <!-- Reuse admin styles for consistency -->
    <script src="https://kit.fontawesome.com/b80e3de11b.js" ></script>
    <script th:src="@{/js/userMenu.js}"></script>
    <title>Admin - Users</title>
</head>
<body>
    <header>
        <img src="/images/logo.svg" class="logo" alt="logo">
        <div>
            <ul>
                <li> <a th:href="@{/admin/home}">Projects</a> </li>
                <li class="active">Users</li>
            </ul>
            <div class="user-menu">
                <i class="fa-regular fa-circle-user user-icon"></i>
                <div class="user-dropdown">
                    <a th:href="@{/logout}" class="dropdown-item">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </header>
    <div class="container">
        <h1>User Management</h1>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>

        <!-- TODO: Add search and create user functionality later if needed -->

        <div class="user-list">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.role}"></td>
                        <td>
                            <!-- TODO: Add Edit/Delete buttons later -->
                            <button class="edit-btn" disabled><i class="fas fa-edit"></i></button>
                            <button class="delete-btn" disabled><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TODO: Add modal for creating/editing users later if needed -->

    <!-- <script th:src="@{/js/adminUsers.js}"></script> --> <!-- Optional JS file -->

</body>
</html>
