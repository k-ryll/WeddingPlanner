<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seat Plan</title>
    <link rel="stylesheet" th:href="@{/styles/home.css}">
    <link rel="stylesheet" th:href="@{/styles/seat-plan.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.0/jquery-ui.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Seat Plan for <span th:text="${project.projectName}"></span></h1>
        
        <div class="controls">
            <button id="addTableBtn" class="btn btn-primary">Add Table</button>
            <button id="saveBtn" class="btn btn-success">Save Layout</button>
        </div>

        <div id="seatPlanArea" class="seat-plan-area">
            <div th:each="table : ${seatPlan.tables}" 
                 class="table" 
                 th:data-id="${table.id}"
                 th:style="'left: ' + ${table.positionX} + 'px; top: ' + ${table.positionY} + 'px;'">
                <div class="table-header">
                    <div class="table-name" th:text="${table.tableName}"></div>
                    <div class="table-actions">
                        <button class="table-action-btn edit-btn" th:data-id="${table.id}">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="table-action-btn delete-btn" th:data-id="${table.id}">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
                <div class="chair-count" th:text="${table.numberOfChairs} + ' chairs'"></div>
                <div class="chairs-container">
                    <div th:each="i : ${#numbers.sequence(1, table.numberOfChairs)}" class="chair"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="addTableModal" class="modal">
        <div class="modal-content">
            <h2>Add New Table</h2>
            <form id="addTableForm">
                <div class="form-group">
                    <label for="tableName">Table Name:</label>
                    <input type="text" id="tableName" name="tableName" required placeholder="Enter table name">
                </div>
                <div class="form-group">
                    <label for="numberOfChairs">Number of Chairs:</label>
                    <input type="number" id="numberOfChairs" name="numberOfChairs" min="1" max="12" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Table</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editTableModal" class="modal">
        <div class="modal-content">
            <h2>Edit Table</h2>
            <form id="editTableForm">
                <input type="hidden" id="editTableId">
                <div class="form-group">
                    <label for="editTableName">Table Name:</label>
                    <input type="text" id="editTableName" name="tableName" required placeholder="Enter table name">
                </div>
                <div class="form-group">
                    <label for="editNumberOfChairs">Number of Chairs:</label>
                    <input type="number" id="editNumberOfChairs" name="numberOfChairs" min="1" max="12" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        const projectId = /*[[${project.id}]]*/ 0;
        const seatPlanId = /*[[${seatPlan.id}]]*/ 0;

        $(document).ready(function() {
            // Make tables draggable with improved handling
            $('.table').draggable({
                containment: '#seatPlanArea',
                start: function(e, ui) {
                    // Prevent dragging when clicking buttons
                    if ($(e.target).hasClass('table-action-btn')) {
                        return false;
                    }
                },
                stop: function(event, ui) {
                    updateTablePosition($(this));
                }
            });

            // Add table button click handler
            $('#addTableBtn').click(function() {
                $('#addTableModal').show();
            });

            // Add table form submission
            $('#addTableForm').submit(function(e) {
                e.preventDefault();
                const tableName = $('#tableName').val();
                const numberOfChairs = $('#numberOfChairs').val();
                
                $.ajax({
                    url: '/project/' + projectId + '/seatplan/add-table',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        tableName: tableName,
                        numberOfChairs: numberOfChairs,
                        positionX: 100,
                        positionY: 100
                    }),
                    success: function(response) {
                        if (response && response.id) {
                            addTableToPlan(response);
                            $('#addTableModal').hide();
                            $('#addTableForm')[0].reset();
                        } else {
                            alert('Error: Invalid response from server');
                        }
                    },
                    error: function(xhr) {
                        console.error('Error adding table:', xhr);
                        alert('Error adding table. Please try again.');
                    }
                });
            });

            // Edit table button click handler
            $(document).on('click', '.edit-btn', function(e) {
                e.stopPropagation(); // Prevent table dragging when clicking edit
                const tableId = $(this).data('id');
                const table = $(this).closest('.table');
                const tableName = table.find('.table-name').text();
                const chairCount = table.find('.chair').length;
                
                $('#editTableId').val(tableId);
                $('#editTableName').val(tableName);
                $('#editNumberOfChairs').val(chairCount);
                $('#editTableModal').show();
            });

            // Edit table form submission
            $('#editTableForm').submit(function(e) {
                e.preventDefault();
                const tableId = $('#editTableId').val();
                const tableName = $('#editTableName').val();
                const numberOfChairs = $('#editNumberOfChairs').val();
                
                $.ajax({
                    url: '/project/' + projectId + '/seatplan/update-table/' + tableId,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        tableName: tableName,
                        numberOfChairs: numberOfChairs
                    }),
                    success: function(response) {
                        if (response && response.id) {
                            updateTableInPlan(response);
                            $('#editTableModal').hide();
                            $('#editTableForm')[0].reset();
                        } else {
                            alert('Error: Invalid response from server');
                        }
                    },
                    error: function(xhr) {
                        console.error('Error updating table:', xhr);
                        alert('Error updating table. Please try again.');
                    }
                });
            });

            // Delete table button click handler
            $(document).on('click', '.delete-btn', function(e) {
                e.stopPropagation(); // Prevent table dragging when clicking delete
                if (confirm('Are you sure you want to delete this table?')) {
                    const tableId = $(this).data('id');
                    $.ajax({
                        url: '/project/' + projectId + '/seatplan/delete-table/' + tableId,
                        method: 'DELETE',
                        success: function() {
                            $('.table[data-id="' + tableId + '"]').remove();
                        },
                        error: function(xhr) {
                            console.error('Error deleting table:', xhr);
                            alert('Error deleting table. Please try again.');
                        }
                    });
                }
            });

            // Save button click handler
            $('#saveBtn').click(function() {
                const tables = [];
                $('.table').each(function() {
                    const position = $(this).position();
                    tables.push({
                        id: $(this).data('id'),
                        positionX: Math.round(position.left),
                        positionY: Math.round(position.top)
                    });
                });

                $.ajax({
                    url: '/project/' + projectId + '/seatplan/update-positions',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(tables),
                    success: function() {
                        alert('Layout saved successfully!');
                    },
                    error: function(xhr) {
                        alert('Error saving layout: ' + xhr.responseText);
                    }
                });
            });

            // Close modals when clicking outside
            $(window).click(function(e) {
                if ($(e.target).hasClass('modal')) {
                    $('#addTableModal').hide();
                    $('#editTableModal').hide();
                    $('#addTableForm')[0].reset();
                    $('#editTableForm')[0].reset();
                }
            });

            // Prevent modal from closing when clicking inside
            $('.modal-content').click(function(e) {
                e.stopPropagation();
            });
        });

        function updateTablePosition(tableElement) {
            const position = tableElement.position();
            $.ajax({
                url: '/project/' + projectId + '/seatplan/update-positions',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify([{
                    id: tableElement.data('id'),
                    positionX: Math.round(position.left),
                    positionY: Math.round(position.top)
                }]),
                error: function(xhr) {
                    alert('Error updating table position: ' + xhr.responseText);
                }
            });
        }

        function addTableToPlan(table) {
            const tableElement = $('<div>')
                .addClass('table')
                .data('id', table.id)
                .css({
                    left: table.positionX + 'px',
                    top: table.positionY + 'px'
                })
                .append($('<div>').addClass('table-header')
                    .append($('<div>').addClass('table-name').text(table.tableName))
                    .append($('<div>').addClass('table-actions')
                        .append($('<button>').addClass('table-action-btn edit-btn').html('<i class="fas fa-edit"></i> Edit').data('id', table.id))
                        .append($('<button>').addClass('table-action-btn delete-btn').html('<i class="fas fa-trash"></i> Delete').data('id', table.id))))
                .append($('<div>').addClass('chair-count').text(table.numberOfChairs + ' chairs'))
                .append($('<div>').addClass('chairs-container'));

            // Add chair circles
            for (let i = 0; i < table.numberOfChairs; i++) {
                tableElement.find('.chairs-container').append($('<div>').addClass('chair'));
            }

            tableElement.draggable({
                containment: '#seatPlanArea',
                stop: function(event, ui) {
                    updateTablePosition($(this));
                }
            });

            $('#seatPlanArea').append(tableElement);
        }

        function updateTableInPlan(table) {
            const tableElement = $('.table[data-id="' + table.id + '"]');
            tableElement.find('.table-name').text(table.tableName);
            tableElement.find('.chair-count').text(table.numberOfChairs + ' chairs');
            
            const chairsContainer = tableElement.find('.chairs-container');
            chairsContainer.empty();
            
            for (let i = 0; i < table.numberOfChairs; i++) {
                chairsContainer.append($('<div>').addClass('chair'));
            }
        }

        function closeModal() {
            $('#addTableModal').hide();
            $('#addTableForm')[0].reset();
        }

        function closeEditModal() {
            $('#editTableModal').hide();
            $('#editTableForm')[0].reset();
        }
    </script>
</body>
</html>
